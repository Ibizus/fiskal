repos:
  - repo: local
    hooks:
      - id: guard-personal-data
        name: personal data guard
        entry: uv run python scripts/guard_personal_data.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format check (lockfile version)
        entry: uv run ruff format --check
        language: system
        pass_filenames: false

      - id: ruff
        name: ruff lint with autofix (lockfile version)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false

      - id: mypy-strict
        name: mypy strict on core packages
        entry: uv run mypy --strict src/fiskal/domain src/fiskal/classification src/fiskal/importers
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest with coverage
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: alembic-check
        name: alembic migration check
        entry: bash -c 'uv run alembic -c migrations/alembic.ini upgrade head && uv run alembic -c migrations/alembic.ini check'
        language: system
        pass_filenames: false
        always_run: true
