[project]
name = "fiskal"
version = "0.1.0"
description = "Local-first personal finance app"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [
    { name = "Fiskal contributors" },
]
keywords = ["finance", "personal-finance", "local-first", "sqlite", "streamlit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "streamlit>=1.39",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-requests>=2.32",
]

[project.scripts]
fiskal = "fiskal.ui.launcher:main"

[project.urls]
Homepage = "https://github.com/Ibizus/fiskal"
Repository = "https://github.com/Ibizus/fiskal"
Issues = "https://github.com/Ibizus/fiskal/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiskal"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["migrations/versions/*"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
    "PL",
]
ignore = [
    "D100",  # Missing docstring in public module (module docstrings optional)
    "D104",  # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["fiskal.domain.*"]
strict = true

[[tool.mypy.overrides]]
module = ["fiskal.classification.*"]
strict = true

[[tool.mypy.overrides]]
module = ["fiskal.importers.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=fiskal.domain",
    "--cov=fiskal.classification",
    "--cov=fiskal.importers",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["src/fiskal"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
